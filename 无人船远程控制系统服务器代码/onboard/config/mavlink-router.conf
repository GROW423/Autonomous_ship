# ============================================================
# mavlink-router 配置文件
# 功能: 将Pixhawk飞控的MAVLink数据通过4G转发到云服务器
# 部署路径: /opt/usv/config/mavlink-router.conf
# ============================================================

[General]
# MAVLink系统ID (本船的ID, 每艘船唯一, 1-255)
SystemId=1

# 禁用控制台输出 (systemd管理时用journalctl看日志)
# LogToConsole=false

# 日志文件路径 (记录原始MAVLink数据, 用于事后分析)
Log=/opt/usv/logs/mavlink
# 日志文件最大大小 (字节), 超过后滚动
LogFileSize=10485760

# ============================================================
# UART端点 - 连接Pixhawk TELEM2
# ============================================================
# 飞控 TELEM2 引脚 -> 香橙派 GPIO:
#   TX (飞控发)  -> GPIO10 (RX, /dev/ttyS1)
#   RX (飞控收)  -> GPIO8  (TX, /dev/ttyS1)
#   GND          -> GND
#   注意: 不要接VCC, 两边都是3.3V TTL可直连
[UartEndpoint pixhawk]
Device=/dev/ttyS1
Baud=921600
# 流控关闭 (TELEM2不需要)
FlowControl=NONE

# ============================================================
# TCP客户端端点 - 连接云服务器MAVLink网关
# 4G网络下船端没有公网IP, 采用主动连接云服务器的方式
# ============================================================
[TcpEndpoint cloud]
# !!! 请修改为你的云服务器公网IP或域名 !!!
Address=YOUR_SERVER_IP
# 云服务器MAVLink网关监听端口
Port=5760
# 重连间隔 (秒)
RetryTimeout=5

# ============================================================
# UDP端点 - 本地调试 (可选, 用于QGC直连调试)
# 在同一局域网内, QGC连接 香橙派IP:14550
# ============================================================
[UdpEndpoint local_debug]
Mode=Normal
Address=127.0.0.1
Port=14550

# ============================================================
# 说明:
# 1. 确认串口设备名: ls /dev/ttyS*
#    OrangePi Zero2W 启用uart1 overlay后通常是 /dev/ttyS1
# 2. 确认云服务器地址后修改 Address 字段
# 3. 多艘船时修改 SystemId 为不同值 (1-255)
# 4. 查看实时MAVLink数据: mavlink-routerd -e 127.0.0.1:14550 /dev/ttyS1:921600
# ============================================================
